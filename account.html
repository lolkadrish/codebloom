<!doctype html>
<html lang="ru" data-theme="light" data-course="account">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7255db"><meta name="description" content="Необязательный аккаунт для сохранения прогресса Python между устройствами. Можно учиться и без входа.">
  <meta name="referrer" content="no-referrer"><title>Аккаунт · Python с нуля</title>
  <link rel="icon" href="branching/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="branching/styles.css?v=14">
  <script src="branching/account-config.js?v=1" defer></script><script src="branching/progress-store.js?v=1" defer></script><script src="branching/account-text.js?v=1" defer></script><script src="branching/cloud-sync.js?v=2" defer></script>
  <script src="branching/leaderboard-text.js?v=1" defer></script><script src="branching/study-time.js?v=1" defer></script><script src="branching/account.js?v=3" defer></script>
  <link rel="stylesheet" href="branching/start-choice.css?v=1">
  <script src="branching/start-choice.js?v=2" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="branching/">Python с нуля.</a><span class="top-caption">PYTHON / ACCOUNT</span><div class="top-controls"><label class="select-wrap language"><span aria-hidden="true">◎</span><select id="account-language" aria-label="Язык сайта"><option value="ru">Русский</option><option value="uk">Українська</option><option value="en">English</option></select></label></div></header>
  <main class="account-page">
    <div class="eyebrow"><span class="tag">PYTHON / ACCOUNT</span></div><h1 data-account-text="title">Твой прогресс — с тобой</h1><p class="account-lead" data-account-text="intro"></p><a class="secondary-button rank-entry" href="leaderboard.html" data-rank-text="nav">◷ Рейтинг занятий</a>
    <div id="account-unavailable" class="account-notice" role="status" hidden data-account-text="unavailable"></div>
    <div class="account-grid">
      <section class="account-card"><span class="summary-icon" aria-hidden="true">⌂</span><h2 data-account-text="localTitle"></h2><p data-account-text="localHelp"></p><a id="guest-continue" class="secondary-button" href="branching/" data-account-text="localTitle"></a></section>
      <section class="account-card" id="account-auth-card">
        <span class="summary-icon" aria-hidden="true">◎</span><h2 data-account-text="signInTitle"></h2><p data-account-text="emailHelp"></p>
        <form id="account-email-form"><label for="account-email" data-account-text="email"></label><input id="account-email" name="email" type="email" autocomplete="email" maxlength="254" required><button id="account-send" type="submit" class="primary-button" data-account-text="send"></button></form>
        <form id="account-code-form" hidden><p id="account-sent"></p><label for="account-code" data-account-text="code"></label><input id="account-code" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required><button id="account-verify" type="submit" class="primary-button" data-account-text="verify"></button><button id="account-resend" type="button" class="secondary-button" data-account-text="resend"></button><span id="account-cooldown" class="muted"></span></form>
        <p class="account-privacy" data-account-text="consent"></p>
      </section>
    </div>
    <section class="account-card" id="account-profile" hidden><h2 id="account-identity"></h2><p data-account-text="cloudHelp"></p><p id="account-sync-state" class="account-sync-state" role="status" aria-live="polite"></p><p id="account-last-sync" class="muted"></p><div class="account-actions"><a id="account-continue" class="primary-button" href="branching/" data-account-text="continue"></a><button id="account-sync" class="secondary-button" data-account-text="sync"></button><button id="account-signout" class="secondary-button" data-account-text="signOut"></button></div></section>
    <section class="account-card" id="account-import-panel" hidden><h2 data-account-text="importTitle"></h2><p data-account-text="importHelp"></p><button id="account-import" class="secondary-button" data-account-text="import"></button></section>
    <details class="account-card" id="account-history" hidden><summary data-account-text="history"></summary><p data-account-text="historyHelp"></p><div id="account-history-list"></div></details>
    <p id="account-message" class="account-message" role="status" aria-live="polite"></p>
  </main>
</body></html>
